[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-news"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.optional-dependencies]
voyage = ["httpx>=0.27"]
all = ["ai-news[voyage]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
